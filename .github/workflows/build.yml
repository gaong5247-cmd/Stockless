name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize Stockless
        run: python tools/materialize.py
      - name: Verify threat-history invariants
        shell: bash
        run: |
          c++ -std=c++17 -O2 -Ibuild/stockless-src/src tests/threat_history_test.cpp -o threat_history_test
          ./threat_history_test
      - name: Verify v0.7 search policy decision equivalence
        shell: bash
        run: |
          c++ -std=c++17 -O2 -Ibuild/stockless-src/src tests/search_policy_test.cpp -o search_policy_test
          ./search_policy_test
      - name: Build
        run: make -C build/stockless-src/src -j2 build ARCH=x86-64-avx2
      - name: UCI smoke
        shell: bash
        run: |
          BIN=build/stockless-src/src/stockless
          test -x "$BIN"
          printf 'uci\nsetoption name StocklessHybrid value true\nsetoption name StocklessAggression value 125\nsetoption name StocklessThreats value true\nsetoption name StocklessOverdrive value true\nsetoption name StocklessMobile value false\nisready\nquit\n' | "$BIN" | tee uci.txt
          grep -qx 'id name Stockless v0.7.1' uci.txt
          grep -q 'option name StocklessHybrid type check default true' uci.txt
          grep -q 'option name StocklessAggression type spin default 145' uci.txt
          grep -q 'option name StocklessThreats type check default true' uci.txt
          grep -q 'option name StocklessThreatHistory type check' uci.txt
          grep -q 'option name StocklessHistoryWeight type spin default 100' uci.txt
          grep -q 'option name StocklessOverdrive type check default false' uci.txt
          grep -q 'option name StocklessMobile' uci.txt
          grep -q 'uciok' uci.txt
          grep -q 'readyok' uci.txt
      - name: Threat-history ON/OFF real-search smoke
        run: python tests/uci_history_smoke.py build/stockless-src/src/stockless
      - name: Package Linux artifact
        shell: bash
        run: |
          mkdir -p dist/linux
          cp build/stockless-src/src/stockless dist/linux/stockless
          cp assets/stockless-logo.svg engine-branding.json LICENSE NOTICE.md dist/linux/
          cp docs/GUI_BRANDING.md dist/linux/
      - uses: actions/upload-artifact@v4
        with:
          name: Stockless-v0.7.1-Linux-x86_64-avx2
          path: dist/linux
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize Stockless
        run: python tools/materialize.py
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            curl
            mingw-w64-ucrt-x86_64-gcc
      - name: Build
        shell: msys2 {0}
        run: make -C build/stockless-src/src -j2 build ARCH=x86-64-avx2 COMP=mingw
      - name: Verify binary
        shell: pwsh
        run: |
          if (-not (Test-Path "build/stockless-src/src/stockless.exe")) {
            throw "stockless.exe was not built"
          }
          $uciText = @("uci", "isready", "quit") | & "build/stockless-src/src/stockless.exe"
          if ($LASTEXITCODE -ne 0) { throw "UCI handshake exited with code $LASTEXITCODE" }
          if ($uciText -notcontains "id name Stockless v0.7.1") { throw "Incorrect UCI identity: $uciText" }
          if ($uciText -notcontains "uciok" -or $uciText -notcontains "readyok") { throw "UCI startup failed" }
          if (-not ($uciText -match "option name StocklessThreatHistory type check default false")) { throw "Incorrect history default" }
      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/windows" | Out-Null
          Copy-Item "build/stockless-src/src/stockless.exe" "dist/windows/stockless.exe"
          Copy-Item "assets/stockless-logo.svg","engine-branding.json","LICENSE","NOTICE.md" "dist/windows/"
          Copy-Item "docs/GUI_BRANDING.md" "dist/windows/"
      - uses: actions/upload-artifact@v4
        with:
          name: Stockless-v0.7.1-Windows-x86_64-avx2
          path: dist/windows
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            arch: armv8
            compiler: aarch64-linux-android26-clang++
          - abi: armeabi-v7a
            arch: armv7-neon
            compiler: armv7a-linux-androideabi26-clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NDK r27c
        shell: bash
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" "ndk;27.2.12479018"
          SDK_RC=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_RC" -eq 0
          test -d "$SDK_ROOT/ndk/27.2.12479018"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Materialize Stockless
        run: python tools/materialize.py
      - name: Build DroidFish engine
        shell: bash
        run: |
          export NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make -C build/stockless-src/src -j2 build \
            ARCH=${{ matrix.arch }} COMP=ndk COMPCXX=${{ matrix.compiler }}
          mkdir -p dist
          cp build/stockless-src/src/stockless "dist/stockless-v0.7.1-${{ matrix.abi }}"
          chmod +x "dist/stockless-v0.7.1-${{ matrix.abi }}"
          file "dist/stockless-v0.7.1-${{ matrix.abi }}"
          llvm-readelf -h "dist/stockless-v0.7.1-${{ matrix.abi }}" | tee "dist/elf-${{ matrix.abi }}.txt"
      - name: Verify ABI
        shell: bash
        run: |
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            grep -Eq 'AArch64|ARM aarch64' "dist/elf-${{ matrix.abi }}.txt"
          else
            grep -Eq 'ARM' "dist/elf-${{ matrix.abi }}.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Stockless-v0.7.1-DroidFish-${{ matrix.abi }}
          path: |
            dist/stockless-v0.7.1-${{ matrix.abi }}
            dist/elf-${{ matrix.abi }}.txt
            assets/stockless-logo.svg
            engine-branding.json
            LICENSE
            NOTICE.md
            docs/GUI_BRANDING.md
          if-no-files-found: error
