name: optimization-benchmark

# Exact-node comparisons are meaningful only for semantics-preserving changes.
# Functional search changes use validated-improvement.yml's paired match gate.
# This research helper is deliberately manual so changed search trees are not
# misreported as a failure of a correctly functioning strength candidate.
on:
  workflow_dispatch:
    inputs:
      reference_ref:
        description: Exact reference commit/tag for a semantics-preserving comparison
        required: true
        type: string

jobs:
  deterministic-linux-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate optimization scripts and arena options
        run: |
          python3 -m py_compile tools/compare_bench.py tools/compare_lean_policy_profiles.py tools/materialize.py tests/test_cutechess_defaults.py
          bash -n scripts/build-optimized.sh scripts/run-cutechess-match.sh
          python3 tests/test_cutechess_defaults.py

      - name: Build candidate (fixed x86-64-avx2)
        run: |
          python3 tools/materialize.py
          make -C build/stockless-src/src -j2 build ARCH=x86-64-avx2
          cp build/stockless-src/src/stockless candidate-stockless

      - name: Build explicit frozen reference (same ISA)
        shell: bash
        env:
          REFERENCE_REF: ${{ inputs.reference_ref }}
        run: |
          set -euxo pipefail
          BASE_SHA=$(git rev-parse --verify --end-of-options "${REFERENCE_REF}^{commit}")
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git worktree add --detach ../stockless-reference "$BASE_SHA"
          git -C ../stockless-reference submodule update --init --recursive
          (
            cd ../stockless-reference
            python3 tools/materialize.py
            make -C build/stockless-src/src -j2 build ARCH=x86-64-avx2
          )
          cp ../stockless-reference/build/stockless-src/src/stockless reference-stockless

      - name: Interleaved depth-12 bench with exact node-count guard
        shell: bash
        run: |
          set -o pipefail
          python3 tools/compare_bench.py ./reference-stockless ./candidate-stockless \
            --depth 12 --rounds 6 2>&1 | tee before-after-bench.txt

      - name: Verify eight lean UCI profiles keep exact node/move results
        shell: bash
        run: |
          set -o pipefail
          python3 tools/compare_lean_policy_profiles.py ./reference-stockless ./candidate-stockless \
            --depth 9 2>&1 | tee lean-policy-profiles.txt

      - name: Build CPU-profiled candidate (explicit request only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          bash scripts/build-pgo.sh build/stockless-src/src x86-64-avx2 gcc 2

      - name: PGO vs standard bench (explicit request only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          python3 tools/compare_bench.py ./candidate-stockless \
            build/stockless-src/src/stockless --depth 12 --rounds 6 \
            2>&1 | tee pgo-bench.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stockless-search-fastpath-bench
          path: |
            before-after-bench.txt
            lean-policy-profiles.txt
            pgo-bench.txt
          if-no-files-found: warn
