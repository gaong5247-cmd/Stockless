name: Stockless v0.7 History Tournament

on:
  push:
    branches:
      - experimental/v0.7-threat-history
    paths:
      - .github/workflows/history-tune.yml
      - arena/HISTORY_TUNE_REQUEST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockless-v07-history-tournament
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load tournament profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE=$(sed -n 's/^profile=//p' arena/HISTORY_TUNE_REQUEST | head -1)
          case "$PROFILE" in
            smoke|full) ;;
            *) echo "Invalid tournament profile $PROFILE"; exit 2;;
          esac
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "Tournament profile: $PROFILE"

      - name: Install Python dependency and run pipeline unit tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check python-chess
          python -m unittest discover -s tests -p 'test_history_tuning.py' -v

      - name: Download official Stockfish opening book
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p results/books
          curl -fL --retry 4 --retry-delay 3 -o results/books/6mvs_90_99.epd.zip \
            'https://raw.githubusercontent.com/official-stockfish/books/master/6mvs_%2B90_%2B99.epd.zip'
          python tools/split_history_book.py \
            --source results/books/6mvs_90_99.epd.zip \
            --profile "$PROFILE" \
            --output results/openings \
            --seed 20261017

      - name: Download Cute Chess 1.5.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 3 \
            -o cutechess.AppImage \
            'https://github.com/cutechess/cutechess/releases/download/v1.5.1/Cute_Chess-1.5.1-x86_64.AppImage'
          chmod +x cutechess.AppImage
          ./cutechess.AppImage --appimage-extract >/dev/null
          CUTE=$(find squashfs-root -type f -name cutechess-cli | head -1)
          test -n "$CUTE"
          chmod +x "$CUTE"
          echo "CUTECHESS=$PWD/$CUTE" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/squashfs-root/usr/lib:$PWD/squashfs-root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Build pinned Stockless and Stockfish
        shell: bash
        run: |
          set -euxo pipefail
          python tools/materialize.py
          c++ -std=c++17 -O2 -Ibuild/stockless-src/src tests/threat_history_test.cpp -o threat_history_test
          ./threat_history_test
          make -C build/stockless-src/src -j2 build ARCH=x86-64-avx2
          make -C upstream/stockfish/src -j2 build ARCH=x86-64-avx2
          test -x build/stockless-src/src/stockless
          test -x upstream/stockfish/src/stockfish
          python tests/uci_history_smoke.py build/stockless-src/src/stockless

      - name: Run weight sweep, holdout and Stockfish matches
        shell: bash
        run: |
          set -euxo pipefail
          python tools/history_tournament.py \
            --profile "$PROFILE" \
            --cutechess "$CUTECHESS" \
            --books results/openings \
            --output results/history-tuning \
            --concurrency 2

      - name: Apply default ONLY if independent confirmation passes
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_history_default.py \
            --decision results/history-tuning/decision.json
          if grep -q '^promoted=true$' "$GITHUB_OUTPUT"; then
            test "$PROFILE" = full
            python tools/materialize.py
            make -C build/stockless-src/src -j2 build ARCH=x86-64-avx2
            printf 'uci\nquit\n' | build/stockless-src/src/stockless > results/default-uci.txt
            grep -q 'option name StocklessThreatHistory type check default true' results/default-uci.txt
            SELECTED_WEIGHT=$(python -c "import json; print(json.load(open('results/history-tuning/decision.json'))['promotion']['weight'])")
            grep -q "option name StocklessHistoryWeight type spin default $SELECTED_WEIGHT" results/default-uci.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/stockless/config.h README.md docs/EXPERIMENT_07.md docs/HISTORY_TUNING_REPORT.md
            git commit -m "tune: promote validated history weight $SELECTED_WEIGHT on experimental branch"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "Promoted ON / weight $SELECTED_WEIGHT on experiment branch" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Default remains OFF: statistical promotion gate did not pass." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload all tournament evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Stockless-v07-History-Tournament
          path: |
            results/openings/manifest.json
            results/history-tuning/
            results/default-uci.txt
          if-no-files-found: warn
