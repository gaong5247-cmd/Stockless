name: Windows Download Build

on:
  push:
    branches: [main]
    paths:
      - arena/WINDOWS_ARTIFACT
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Windows build failure handling
        shell: pwsh
        run: ./tests/test_build_windows.ps1

      - name: Read source version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import sys;sys.path.insert(0,'tools');from package_release import read_version;print(read_version())"
          if ($LASTEXITCODE -ne 0) { throw "Cannot read Stockless source version" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "STOCKLESS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize Stockless
        run: python tools/materialize.py

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            curl
            mingw-w64-ucrt-x86_64-gcc

      - name: Build AVX2
        shell: msys2 {0}
        run: |
          make -C build/stockless-src/src -j2 build ARCH=x86-64-avx2 COMP=mingw
          mkdir -p dist
          cp build/stockless-src/src/stockless.exe "dist/stockless-${STOCKLESS_VERSION}-windows-avx2.exe"

      - name: Build portable x86-64
        shell: msys2 {0}
        run: |
          make -C build/stockless-src/src clean
          make -C build/stockless-src/src -j2 build ARCH=x86-64 COMP=mingw
          cp build/stockless-src/src/stockless.exe "dist/stockless-${STOCKLESS_VERSION}-windows-x86-64.exe"

      - name: Verify UCI identity and real searches in both executables
        shell: pwsh
        run: |
          foreach ($arch in @("avx2", "x86-64")) {
            $binary = "dist/stockless-$env:STOCKLESS_VERSION-windows-$arch.exe"
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing $binary" }
            python tests/uci_lean_smoke.py $binary | Tee-Object -FilePath "dist/uci-smoke-$arch.txt"
            if ($LASTEXITCODE -ne 0) { throw "UCI search regression failed for $arch with $LASTEXITCODE" }
          }

      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE dist\LICENSE.txt
          Copy-Item NOTICE.md dist\NOTICE.md
          @"
          Stockless $env:STOCKLESS_VERSION - Windows

          Included:
          - stockless-$env:STOCKLESS_VERSION-windows-avx2.exe       Requires an AVX2-capable CPU
          - stockless-$env:STOCKLESS_VERSION-windows-x86-64.exe     Compatible x86-64 fallback

          Default UCI settings:
          StocklessHybrid = true
          StocklessAggression = 145
          StocklessThreats = true
          StocklessOverdrive = false
          StocklessMobile = false

          The experimental StocklessThreatHistory and StocklessHistoryWeight options
          have been removed. Delete them from saved GUI configurations.

          UCI engine: add the .exe to your chess GUI and edit the UCI options there.
          The default NNUE networks are embedded; no separate network download is needed.
          Both binaries passed UCI startup, multiple searches and thread-option checks.
          These are ordinary builds. Their playing strength has not been independently measured.
          Source commit: $env:GITHUB_SHA
          "@ | Set-Content -Encoding UTF8 dist\README-WINDOWS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Stockless-${{ steps.version.outputs.value }}-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 90
