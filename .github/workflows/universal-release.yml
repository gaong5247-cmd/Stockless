name: Stockless v0.9.0 universal build and release

on:
  pull_request:
    paths:
      - ".github/workflows/universal-release.yml"
      - "src/stockless/**"
      - "tools/materialize.py"
      - "tools/package_release.py"
      - "engine-branding.json"
  workflow_call:
    inputs:
      publish_validated:
        description: Publish only after the same run's independent strength gate passes
        type: boolean
        required: false
        default: false
  workflow_dispatch:

concurrency:
  group: universal-v090-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86-64 Universal (CPU dispatch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release scripts
        run: python -m py_compile tools/package_release.py tools/verify_release_assets.py tests/uci_lean_smoke.py
      - name: Materialize exact pinned Stockfish and Stockless
        run: python tools/materialize.py
      - name: Build all supported x86-64 instruction-set slices
        run: make -C build/stockless-src/src -j4 build ARCH=x86-64-universal
      - name: UCI protocol and actual search
        shell: bash
        run: |
          set -euo pipefail
          BIN=build/stockless-src/src/stockless
          test -x "$BIN"
          printf 'uci\nisready\nquit\n' | "$BIN" | tee linux-uci.txt
          EXPECTED=$(python -c "import sys;sys.path.insert(0,'tools');from package_release import read_version;print(read_version())")
          test "$EXPECTED" = "v0.9.0"
          grep -Fx "id name Stockless $EXPECTED" linux-uci.txt
          grep -qx 'uciok' linux-uci.txt
          grep -qx 'readyok' linux-uci.txt
          "$BIN" bench 16 1 8 default depth 2>&1 | tee linux-bench.txt
          grep -q 'Nodes searched' linux-bench.txt
          file "$BIN"
      - name: Package Linux x86-64 Universal
        run: |
          python tools/package_release.py --platform linux-x86_64-universal \
            --binary build/stockless-src/src/stockless --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: stockless-v0.9.0-linux-x86_64-universal
          path: dist/Stockless-v0.9.0-linux-x86_64-universal.zip
          if-no-files-found: error

  linux-arm64:
    name: Linux ARM64 Universal (NEON/DotProd dispatch)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize sources
        run: python tools/materialize.py
      - name: Compile arm64 universal
        run: make -C build/stockless-src/src -j4 build ARCH=arm64-universal
      - name: UCI and bench
        shell: bash
        run: |
          set -euo pipefail
          BIN=build/stockless-src/src/stockless
          printf 'uci\nisready\nquit\n' | "$BIN" | tee arm64-uci.txt
          EXPECTED=$(python -c "import sys;sys.path.insert(0,'tools');from package_release import read_version;print(read_version())")
          test "$EXPECTED" = "v0.9.0"
          grep -Fx "id name Stockless $EXPECTED" arm64-uci.txt
          grep -qx 'readyok' arm64-uci.txt
          "$BIN" bench 16 1 8 default depth 2>&1 | tee arm64-bench.txt
          grep -q 'Nodes searched' arm64-bench.txt
      - name: Package Linux ARM64
        run: |
          python tools/package_release.py --platform linux-arm64-universal \
            --binary build/stockless-src/src/stockless --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: stockless-v0.9.0-linux-arm64-universal
          path: dist/Stockless-v0.9.0-linux-arm64-universal.zip
          if-no-files-found: error

  windows-x86_64:
    name: Windows x86-64 Universal (CPU dispatch)
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize sources
        shell: pwsh
        run: python tools/materialize.py
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            make
            git
            mingw-w64-x86_64-gcc
      - name: Build universal Windows exe
        shell: msys2 {0}
        run: |
          make -C build/stockless-src/src -j4 build ARCH=x86-64-universal COMP=mingw
          test -s build/stockless-src/src/stockless.exe
      - name: UCI smoke test on Windows
        shell: pwsh
        run: |
          $bin = ".\build\stockless-src\src\stockless.exe"
          if (-not (Test-Path $bin)) { throw "Missing universal Windows exe" }
          $uci = @("uci", "isready", "quit") | & $bin
          if ($LASTEXITCODE -ne 0) { throw "UCI engine exited with $LASTEXITCODE" }
          $version = python -c "import sys;sys.path.insert(0,'tools');from package_release import read_version;print(read_version())"
          if ($version -ne "v0.9.0") { throw "Unexpected release version: $version" }
          if ($uci -notcontains "id name Stockless $version") { throw "Wrong UCI version: expected Stockless $version; got $uci" }
          if ($uci -notcontains "uciok" -or $uci -notcontains "readyok") { throw "UCI handshake failed" }
          & $bin bench 16 1 8 default depth 2>&1 | Tee-Object -FilePath windows-bench.txt
          if ($LASTEXITCODE -ne 0) { throw "Universal Windows bench failed" }
          if (-not (Select-String -Path windows-bench.txt -Pattern "Nodes searched")) {
            throw "Missing bench nodes"
          }
      - name: Package Windows universal
        shell: pwsh
        run: |
          python tools/package_release.py --platform windows-x86_64-universal `
            --binary build/stockless-src/src/stockless.exe --source-sha "$env:GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: stockless-v0.9.0-windows-x86_64-universal
          path: dist/Stockless-v0.9.0-windows-x86_64-universal.zip
          if-no-files-found: error

  android:
    name: Android ${{ matrix.abi }} (NDK API 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-universal
            arch: arm64-universal
            compiler: aarch64-linux-android26-clang++
            elf: AArch64
          - abi: armeabi-v7a
            arch: armv7-neon
            compiler: armv7a-linux-androideabi26-clang++
            elf: ARM
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Android NDK r27c (Android 8+)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" "ndk;27.2.12479018"
          SDK_RC=${PIPESTATUS[1]}
          set -o pipefail
          test "$SDK_RC" -eq 0
          test -d "$SDK_ROOT/ndk/27.2.12479018"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Materialize sources
        run: python tools/materialize.py
      - name: Compile Android native UCI
        shell: bash
        run: |
          set -euo pipefail
          export NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make -C build/stockless-src/src -j3 build \
            ARCH=${{ matrix.arch }} COMP=ndk COMPCXX=${{ matrix.compiler }}
          test -s build/stockless-src/src/stockless
          llvm-readelf -h build/stockless-src/src/stockless | tee android-elf.txt
          grep -Eiq 'Machine:.*${{ matrix.elf }}' android-elf.txt
          llvm-readelf -d build/stockless-src/src/stockless | tee android-dynamic.txt
      - name: Package Android UCI engine
        run: |
          python tools/package_release.py --platform android-${{ matrix.abi }} \
            --binary build/stockless-src/src/stockless --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: stockless-v0.9.0-android-${{ matrix.abi }}
          path: dist/Stockless-v0.9.0-android-${{ matrix.abi }}.zip
          if-no-files-found: error

  publish:
    name: Publish verified Stockless v0.9.0 Release
    needs: [linux-x86_64, linux-arm64, windows-x86_64, android]
    if: >-
      inputs.publish_validated == true &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/improvement/20261025-validated-search' &&
      github.repository == 'gaong5247-cmd/Stockless'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install chess==1.11.2
      - uses: actions/download-artifact@v4
        with:
          pattern: stockless-v0.9.0-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: validation-evidence
          path: validation-evidence
      - name: Require approved evidence for this exact source commit
        shell: bash
        run: |
          set -euo pipefail
          python release/create_validation_notes.py \
            --report validation-evidence/validation-report/report.json \
            --summary validation-evidence/validation-report/report.md \
            --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --output release-notes.md
          cp validation-evidence/validation-report/report.json release-assets/validation-report.json
          cp validation-evidence/validation-report/report.md release-assets/validation-report.md
      - name: Verify all OS archives, UCI version, checksums and manifests
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_release_assets.py release-assets --expected-commit "$GITHUB_SHA"
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release (fail on existing tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=Stockless_v0.9.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a published release" >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/*.zip release-assets/SHA256SUMS.txt \
            release-assets/validation-report.json release-assets/validation-report.md \
            --target "$GITHUB_SHA" \
            --title "Stockless v0.9.0 — Universal Windows, Linux & Android" \
            --notes-file release-notes.md \
            --latest
          gh release view "$TAG" --json url,tagName,assets
