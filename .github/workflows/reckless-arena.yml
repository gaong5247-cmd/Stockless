name: Reckless Fair Arena

on:
  push:
    branches: [main]
    paths:
      - arena/RECKLESS_LONG

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check chess
      - name: Fetch Cute Chess 1.5.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o cutechess.AppImage https://github.com/cutechess/cutechess/releases/download/v1.5.1/Cute_Chess-1.5.1-x86_64.AppImage
          chmod +x cutechess.AppImage
          ./cutechess.AppImage --appimage-extract >/dev/null
          CUTE=$(find squashfs-root -type f -name cutechess-cli | head -1)
          test -n "$CUTE"
          echo "CUTECHESS=$PWD/$CUTE" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/squashfs-root/usr/lib:$PWD/squashfs-root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
          "$CUTE" --version
      - name: Generate openings
        run: python tools/make_openings.py tests/opening_lines.txt tests/openings.epd
      - name: Build Stockless
        shell: bash
        run: |
          python tools/materialize.py
          make -C build/stockless-src/src -j2 build ARCH=x86-64-avx2
      - name: Build Reckless
        shell: bash
        run: |
          cd upstream/reckless
          RUSTFLAGS="-C target-cpu=native" cargo build --release --no-default-features
          mkdir -p ../../build
          cp target/release/reckless ../../build/reckless
          chmod +x ../../build/reckless
      - name: Run 1000-game fairer match
        shell: bash
        run: |
          mkdir -p results
          CUTECHESS="$CUTECHESS" bash scripts/run-cutechess-match.sh \
            "$PWD/build/reckless" Reckless \
            "$PWD/results/reckless-vs-stockless-1s.pgn" 1000 1+0.01 2 \
            2>&1 | tee results/reckless-vs-stockless-1s.log
          python tools/match_summary.py results/reckless-vs-stockless-1s.pgn Stockless | tee results/reckless-vs-stockless-1s-summary.txt
      - name: Summary
        if: always()
        shell: bash
        run: |
          cat results/*summary.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reckless-vs-stockless-1s-1000games
          path: results/
          if-no-files-found: warn
